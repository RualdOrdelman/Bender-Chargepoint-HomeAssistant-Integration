modbus:
  - name: modbus_hub
    type: tcp
    host: 192.168.1.194
    port: 502
    delay: 0
    message_wait_milliseconds: 30
    timeout: 10
    sensors:

    #--------OMCCI / Open Modbus Dataset--------
      # Charge Point Status (R)
      - name: "Bender_ChargePointState"
        slave: 1
        address: 104
        input_type: holding
        data_type: uint16
        scan_interval: 10
      # Vehicle State / Control Pilot State (R) - IEC 61851-1
      - name: "Bender_Vehicle_State"
        slave: 1
        address: 122
        input_type: holding
        data_type: uint16
        scan_interval: 10
      # Safe Current (R/W) - 131
      - name: "Bender_SafeCurrent"
        slave: 1
        address: 131
        input_type: holding
        data_type: uint16
        unit_of_measurement: "A"
        scan_interval: 30
      # Controller fallback timeout; read-only in HA, never rewritten periodically.
      - name: "Bender_Modbus_Timeout"
        slave: 1
        address: 132
        input_type: holding
        data_type: uint16
        unit_of_measurement: "s"
        scan_interval: 30
      # Power per phase (R) - 32-bit registers
      - name: "Bender_Power_L1"
        slave: 1
        address: 206
        input_type: holding
        data_type: uint32
        unit_of_measurement: "W"
        device_class: power
        scan_interval: 10
      - name: "Bender_Power_L2"
        slave: 1
        address: 208
        input_type: holding
        data_type: uint32
        unit_of_measurement: "W"
        device_class: power
        scan_interval: 10
      - name: "Bender_Power_L3"
        slave: 1
        address: 210
        input_type: holding
        data_type: uint32
        unit_of_measurement: "W"
        device_class: power
        scan_interval: 10
      # Current per phase (R) - 32-bit, in mA
      - name: "Bender_Current_L1"
        slave: 1
        address: 212
        input_type: holding
        data_type: uint32
        unit_of_measurement: "mA"
        device_class: current
        scan_interval: 10
      - name: "Bender_Current_L2"
        slave: 1
        address: 214
        input_type: holding
        data_type: uint32
        unit_of_measurement: "mA"
        device_class: current
        scan_interval: 10
      - name: "Bender_Current_L3"
        slave: 1
        address: 216
        input_type: holding
        data_type: uint32
        unit_of_measurement: "mA"
        device_class: current
        scan_interval: 10
      # Lifetime Energy - Total energy ever charged (R) - 32-bit
      - name: "Bender_Lifetime_Energy"
        slave: 1
        address: 218
        input_type: holding
        data_type: uint32
        unit_of_measurement: "Wh"
        device_class: energy
        state_class: total_increasing
        scan_interval: 60
      - name: "Bender_TotalPower"
        slave: 1
        address: 220
        input_type: holding
        data_type: uint32
        unit_of_measurement: "W"
        device_class: power
        scan_interval: 10
      # HEMS Limit (R/W)
      - name: "Bender_HEMS_Limit"
        slave: 1
        address: 1000
        input_type: holding
        data_type: uint16
        unit_of_measurement: "A"
        scan_interval: 30
      # Session Energy - Charged energy current session (R) - 32-bit
      - name: "Bender_Session_Energy"
        slave: 1
        address: 716
        input_type: holding
        data_type: uint32
        unit_of_measurement: "Wh"
        device_class: energy
        scan_interval: 30
      # Session Duration - Charge duration in seconds (R) - 32-bit
      - name: "Bender_Session_Duration"
        slave: 1
        address: 718
        input_type: holding
        data_type: uint32
        unit_of_measurement: "s"
        device_class: duration
        scan_interval: 30
      # EV Battery State / SOC (R)
      - name: "Bender_EV_Battery_SOC"
        slave: 1
        address: 730
        input_type: holding
        data_type: uint16
        unit_of_measurement: "%"
        device_class: battery
        scan_interval: 60
      # IDTag - Active session RFID tag identifier (R) - 10 registers (20 chars UTF-8)
      # modpoll registers 721-730 = HA address 720-729
      - name: "Bender_IDTag"
        slave: 1
        address: 720
        input_type: holding
        data_type: string
        count: 10
        scan_interval: 30
      # Error Codes (R) - Bitmask for active errors (32-bit: registers 105-106)
      - name: "Bender_Error_Code"
        slave: 1
        address: 105
        input_type: holding
        data_type: uint32
        swap: word
        scan_interval: 10
      # Error Events (R) - Bitmask for historical events (32-bit: registers 158-159)
      - name: "Bender_Error_Events"
        slave: 1
        address: 158
        input_type: holding
        data_type: uint32
        swap: word
        scan_interval: 60


###########################################################################################################
# INPUT NUMBER
###########################################################################################################
input_number:

  # Guarded demand, recorded before attempting Modbus; never edit these helpers manually.
  bender_requested_current:
    name: Laadpaal bewaakte opdracht
    min: 0
    max: 16
    step: 1
    initial: 0
    unit_of_measurement: "A"
    mode: box

  # Oldest unresolved command, not the latest retry. Epoch avoids timezone ambiguity.
  bender_hems_unconfirmed_since:
    name: Laadpaal onbevestigd sinds (intern)
    min: 0
    max: 4102444800
    step: 0.001
    initial: 0
    mode: box

  # Last successful positive command; a stop is recorded BEFORE the write.
  # Start conservatively after HA restarts, even if the controller retained 16A.
  bender_commanded_current:
    name: Laadpaal stroom voor LB-verrekening
    min: 0
    max: 16
    step: 1
    initial: 0
    unit_of_measurement: "A"
    mode: box

  bender_strategy_required_kwh:
    name: Benodigde energie
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "kWh"
    icon: mdi:battery-charging
    mode: box

  bender_strategy_max_current:
    name: Max laadstroom
    min: 6
    max: 16
    step: 1
    initial: 16
    unit_of_measurement: "A"
    icon: mdi:current-ac
    mode: slider

  # Persistent snapshot used to restore Manual after a hard fail-safe.
  # No initial value: Home Assistant restores the last stored value.
  bender_failsafe_previous_hems:
    name: HEMS-limiet voor fail-safe
    min: 0
    max: 32
    step: 1
    unit_of_measurement: "A"
    icon: mdi:history
    mode: box

  bender_strategy_pv_min_surplus:
    name: Min. overschot voor laden
    min: 1000
    max: 11000
    step: 100
    initial: 4140
    unit_of_measurement: "W"
    icon: mdi:solar-power
    mode: slider


  # Load Balancer Settings
  bender_loadbalancer_margin:
    name: Load Balancer Veiligheidsmarge
    min: 0
    max: 5000
    step: 100
    initial: 1000
    unit_of_measurement: "W"
    icon: mdi:shield-alert
    mode: slider

  bender_house_max_power:
    name: Huisaansluiting Max Vermogen
    min: 5000
    max: 25000
    step: 250
    initial: 17250
    unit_of_measurement: "W"
    icon: mdi:home-lightning-bolt
    mode: box

###########################################################################################################
# INPUT SELECT
###########################################################################################################
input_select:
  bender_charging_strategy:
    name: Laadpaal Strategie
    options:
      - Uit
      - Direct
      - Manual
      - ChargePV
      - Dynamic
    icon: mdi:ev-station

  bender_failsafe_mode:
    name: Laadpaal fail-safe modus
    options:
      - Monitoren
      - Uit
      - Actief
    icon: mdi:shield-half-full

###########################################################################################################
# INPUT DATETIME
###########################################################################################################
input_datetime:
  bender_strategy_departure_time:
    name: Vertrektijd
    has_date: true
    has_time: true
    icon: mdi:clock-end

  bender_strategy_dynamic_start:
    name: Geplande laadstart
    has_date: true
    has_time: true
    icon: mdi:clock-start

  bender_manual_stop_time:
    name: Sessie stoptijd
    has_date: false
    has_time: true
    icon: mdi:clock-stop

  bender_nodered_heartbeat:
    name: Laatste NodeRed heartbeat
    has_date: true
    has_time: true
    icon: mdi:heart-pulse

###########################################################################################################
# INPUT TEXT
###########################################################################################################
input_text:
  bender_strategy_active_status:
    name: Strategie status
    icon: mdi:information
    max: 255

  bender_hems_change_context:
    name: "Laatste HEMS wijziging context"
    icon: mdi:text-box-search
    max: 255

  bender_failsafe_reason:
    name: "Laadpaal fail-safe reden"
    icon: mdi:shield-alert
    max: 255

###########################################################################################################
# INPUT BOOLEAN
###########################################################################################################
input_boolean:
  bender_strategy_dynamic_must_charge:
    name: Dynamic moet nu laden (deadline)
    icon: mdi:alert-circle

  bender_loadbalancer_enabled:
    name: Load Balancer Actief
    icon: mdi:scale-balance

  bender_manual_stop_scheduled:
    name: Sessie stop gepland
    icon: mdi:calendar-clock

  bender_failsafe_active:
    name: Laadpaal fail-safe actief
    icon: mdi:shield-lock
    initial: false

  bender_failsafe_observed:
    name: Laadpaal watchdog storing gedetecteerd
    icon: mdi:shield-alert-outline
    initial: false

  bender_failsafe_notifications_enabled:
    name: Laadpaal fail-safe pushmeldingen
    icon: mdi:bell-alert

  bender_failsafe_manual_restore_pending:
    name: Manual herstel wacht op laadruimte
    icon: mdi:restart-alert

###########################################################################################################
# TIMER
###########################################################################################################
timer:
  bender_failsafe_recovery:
    name: Laadpaal fail-safe herstelcontrole
    duration: "00:00:30"
    restore: false

###########################################################################################################
# TEMPLATE SENSORS
###########################################################################################################
template:

  # Independent execution feedback; a successful service call is not an acknowledgement.
  - triggers:
    - trigger: time_pattern
      seconds: /5
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id:
      - input_number.bender_requested_current
      - sensor.bender_hems_limit
      - input_boolean.bender_failsafe_active
    variables:
      ack_target: '{{ states(''input_number.bender_requested_current'') | float(-1) }}'
      ack_requested_at: '{{ as_timestamp(states.input_number.bender_requested_current.last_changed, 0) }}'
      ack_reported_at: '{{ as_timestamp(states.sensor.bender_hems_limit.last_reported, 0) }}'
      ack_feedback_age: '{{ as_timestamp(now()) - ack_reported_at | float(0) }}'
      ack_pending_since: '{{ states(''input_number.bender_hems_unconfirmed_since'') | float(0) }}'
      ack_wait_age: '{{ as_timestamp(now()) - (ack_pending_since | float if ack_pending_since | float > 0 else ack_requested_at
        | float) }}'
      ack_confirmed: |-
        {{ is_number(states('input_number.bender_requested_current'))
           and (ack_target | float == 0 or 6 <= ack_target | float <= 16)
           and is_number(states('sensor.bender_hems_limit'))
           and states('sensor.bender_hems_limit') | float == ack_target | float
           and ack_reported_at | float >= ack_requested_at | float
           and 0 <= ack_feedback_age | float <= 45 }}
      ack_healthy: |-
        {% if is_state('input_boolean.bender_failsafe_active', 'on') %}
          {{ ack_confirmed and ack_target | float == 0 }}
        {% else %}
          {{ ack_confirmed or (0 <= ack_wait_age | float <= 45
              and 0 <= ack_feedback_age | float <= 45
              and is_number(states('sensor.bender_hems_limit'))
              and (ack_target | float == 0 or 6 <= ack_target | float <= 16)) }}
        {% endif %}
    binary_sensor:
    - name: Bender HEMS Command Confirmed
      unique_id: bender_hems_command_confirmed
      icon: mdi:check-network
      state: '{{ ack_confirmed }}'
    - name: Bender HEMS Control Healthy
      unique_id: bender_hems_control_healthy
      icon: mdi:shield-check
      state: '{{ ack_healthy }}'
    sensor:
    - name: Bender Requested Current
      unique_id: bender_requested_current
      unit_of_measurement: A
      state: '{{ ack_target }}'
    - name: Bender HEMS Command Status
      unique_id: bender_hems_command_status
      icon: mdi:list-status
      state: |-
        {% if ack_confirmed %}Bevestigd
        {% elif not is_number(states('sensor.bender_hems_limit')) or not (0 <= ack_feedback_age | float <= 45) %}Geen actuele terugmelding
        {% elif ack_wait_age | float > 45 %}Opdracht niet bevestigd
        {% else %}Wacht op terugmelding{% endif %}
      attributes:
        gevraagd_ampere: '{{ ack_target }}'
        teruggemeld_ampere: '{{ states(''sensor.bender_hems_limit'') }}'
        terugmelding_leeftijd_s: '{{ ack_feedback_age | float | round(1) }}'
        onbevestigd_s: '{{ 0 if ack_confirmed else ack_wait_age | float | round(1) }}'

  - sensor:
      - name: "Bender_Charge_Point_Status"
        state: >
          {% set state = states('sensor.bender_chargepointstate') | int(-1) %}
          {% if state == 0 %}Available
          {% elif state == 1 %}Occupied
          {% elif state == 2 %}Reserved
          {% elif state == 3 %}Unavailable
          {% elif state == 4 %}Faulted
          {% elif state == 5 %}Preparing
          {% elif state == 6 %}Charging
          {% elif state == 7 %}SuspendedEVSE
          {% elif state == 8 %}SuspendedEV
          {% elif state == 9 %}Finishing
          {% else %}Unknown
          {% endif %}

      # Vehicle State (Control Pilot) - IEC 61851-1 translation
      - name: "Bender Vehicle Status"
        unique_id: "bender_vehicle_status"
        icon: mdi:car-electric
        state: >
          {% set state = states('sensor.bender_vehicle_state') | int(-1) %}
          {% if state == 1 %}A - Niet aangesloten
          {% elif state == 2 %}B - Aangesloten, niet (meer) aan het laden
          {% elif state == 3 %}C - Laden actief
          {% elif state == 4 %}D - Laden met ventilatie
          {% elif state == 5 %}E - Fout
          {% else %}Onbekend
          {% endif %}
        attributes:
          state_code: "{{ states('sensor.bender_vehicle_state') | int(-1) }}"
          state_letter: >
            {% set state = states('sensor.bender_vehicle_state') | int(-1) %}
            {% if state == 1 %}A
            {% elif state == 2 %}B
            {% elif state == 3 %}C
            {% elif state == 4 %}D
            {% elif state == 5 %}E
            {% else %}?
            {% endif %}

      # Session Owner - Matches IDTag to known RFID cards
      - name: "Bender Session Owner"
        unique_id: "bender_session_owner"
        icon: mdi:card-account-details
        state: >
          {% set tag = states('sensor.bender_idtag') | trim %}
          {% if tag in ['', 'unknown', 'unavailable'] %}
            Geen sessie
          {% elif tag == '044d0182153c84' %}
            Ruald
          {% elif tag == '04c2ac3a3f3e80' %}
            Ellen
          {% else %}
            Onbekend ({{ tag }})
          {% endif %}

      # Session Energy in kWh
      - name: "Bender Session Energy kWh"
        unique_id: "bender_session_energy_kwh"
        icon: mdi:lightning-bolt
        unit_of_measurement: "kWh"
        device_class: energy
        state: >
          {% set wh = states('sensor.bender_session_energy') | float(0) %}
          {{ (wh / 1000) | round(2) }}

      # Session Duration in readable format (H:MM)
      - name: "Bender Session Duration"
        unique_id: "bender_session_duration_formatted"
        icon: mdi:timer-outline
        state: >
          {% set secs = states('sensor.bender_session_duration') | int(0) %}
          {% set hours = (secs // 3600) %}
          {% set minutes = ((secs % 3600) // 60) %}
          {{ hours }}:{{ '%02d' | format(minutes) }}

      # EV Battery SOC - Filters 65535 (unavailable) value
      - name: "Bender EV SOC"
        unique_id: "bender_ev_soc"
        icon: mdi:car-battery
        unit_of_measurement: "%"
        device_class: battery
        state: >
          {% set raw = states('sensor.bender_ev_battery_soc') | int(65535) %}
          {% if raw == 65535 or raw > 100 %}
            unknown
          {% else %}
            {{ raw }}
          {% endif %}

      # Error Code Translation - Converts bitmask to readable error messages
      - name: "Bender Error Status"
        unique_id: "bender_error_status"
        availability: >
          {{ is_number(states('sensor.bender_error_code')) }}
        icon: mdi:alert-circle
        state: >
          {% set code = states('sensor.bender_error_code') | int(0) %}
          {% if code == 0 %}
            Geen fouten
          {% else %}
            {% set errors = [] %}
            {% if code | bitwise_and(0x0001) %}{% set errors = errors + ['Reststroom gedetecteerd'] %}{% endif %}
            {% if code | bitwise_and(0x0002) %}{% set errors = errors + ['Voertuig meldt fout'] %}{% endif %}
            {% if code | bitwise_and(0x0004) %}{% set errors = errors + ['Diode check mislukt'] %}{% endif %}
            {% if code | bitwise_and(0x0008) %}{% set errors = errors + ['MCB Type 2 uitgevallen'] %}{% endif %}
            {% if code | bitwise_and(0x0010) %}{% set errors = errors + ['MCB Schuko uitgevallen'] %}{% endif %}
            {% if code | bitwise_and(0x0020) %}{% set errors = errors + ['Aardlekschakelaar geactiveerd'] %}{% endif %}
            {% if code | bitwise_and(0x0040) %}{% set errors = errors + ['Contactor vastgelast'] %}{% endif %}
            {% if code | bitwise_and(0x0080) %}{% set errors = errors + ['Backend verbinding verbroken'] %}{% endif %}
            {% if code | bitwise_and(0x0100) %}{% set errors = errors + ['Stekker vergrendeling mislukt'] %}{% endif %}
            {% if code | bitwise_and(0x0200) %}{% set errors = errors + ['Vergrendeling zonder stekker fout'] %}{% endif %}
            {% if code | bitwise_and(0x0400) %}{% set errors = errors + ['Actuator vastzittend'] %}{% endif %}
            {% if code | bitwise_and(0x0800) %}{% set errors = errors + ['Actuator detectie mislukt'] %}{% endif %}
            {% if code | bitwise_and(0x1000) %}{% set errors = errors + ['Firmware update bezig'] %}{% endif %}
            {% if code | bitwise_and(0x2000) %}{% set errors = errors + ['Laadpaal gekanteld'] %}{% endif %}
            {% if code | bitwise_and(0x4000) %}{% set errors = errors + ['CP/PR bedrading fout'] %}{% endif %}
            {% if code | bitwise_and(0x8000) %}{% set errors = errors + ['Overbelasting - laden gestopt'] %}{% endif %}
            {{ errors | join(', ') if errors else 'Onbekende fout (' ~ code ~ ')' }}
          {% endif %}
        attributes:
          error_code: "{{ states('sensor.bender_error_code') | int(0) }}"
          has_error: "{{ states('sensor.bender_error_code') | int(0) > 0 }}"

      # Error Events Translation - Converts bitmask to readable event messages
      - name: "Bender Event Log"
        unique_id: "bender_event_log"
        icon: mdi:history
        state: >
          {% set code = states('sensor.bender_error_events') | int(0) %}
          {% if code == 0 %}
            Geen events
          {% else %}
            {% set events = [] %}
            {% if code | bitwise_and(0x0004) %}{% set events = events + ['Reboot uitgevoerd'] %}{% endif %}
            {% if code | bitwise_and(0x0008) %}{% set events = events + ['Autorisatie mislukt'] %}{% endif %}
            {% if code | bitwise_and(0x0010) %}{% set events = events + ['Autorisatie mislukt (zonder notificatie)'] %}{% endif %}
            {% if code | bitwise_and(0x0040) %}{% set events = events + ['Firmware update mislukt'] %}{% endif %}
            {% if code | bitwise_and(0x0100) %}{% set events = events + ['Firmware package manager fout'] %}{% endif %}
            {% if code | bitwise_and(0x0200) %}{% set events = events + ['Onverwachte reset (stroomuitval?)'] %}{% endif %}
            {% if code | bitwise_and(0x0400) %}{% set events = events + ['Transactie gestopt na reset'] %}{% endif %}
            {% if code | bitwise_and(0x0800) %}{% set events = events + ['Slave losgekoppeld van master'] %}{% endif %}
            {% if code | bitwise_and(0x1000) %}{% set events = events + ['Diagnostiek mislukt'] %}{% endif %}
            {% if code | bitwise_and(0x2000) %}{% set events = events + ['RCMB fout'] %}{% endif %}
            {% if code | bitwise_and(0x8000) %}{% set events = events + ['ISO 15118 communicatie mislukt'] %}{% endif %}
            {{ events | join(', ') if events else 'Onbekend event (' ~ code ~ ')' }}
          {% endif %}
        attributes:
          event_code: "{{ states('sensor.bender_error_events') | int(0) }}"
          has_events: "{{ states('sensor.bender_error_events') | int(0) > 0 }}"

      # Available PV surplus power (negative P1 = exporting = available)
      - name: "Bender PV Available Power"
        unique_id: "bender_pv_available_power"
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p1_power = states('sensor.p1_meter_power') | float(0) %}
          {% if p1_power < 0 %}
            {{ (p1_power * -1) | round(0) }}
          {% else %}
            0
          {% endif %}

      # -------------------------------------------------------------------------
      # LOAD BALANCER SENSORS
      # -------------------------------------------------------------------------

      # Calculated "House Only" consumption (P1 Total - Charger Total)
      - name: "Bender House Consumption Excl Charger"
        unique_id: "bender_house_consumption_excl_charger"
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% set p1_l1 = (states('sensor.dsmr_reading_phase_currently_delivered_l1') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l1') | float(0)) * 1000 %}
          {% set p1_l2 = (states('sensor.dsmr_reading_phase_currently_delivered_l2') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l2') | float(0)) * 1000 %}
          {% set p1_l3 = (states('sensor.dsmr_reading_phase_currently_delivered_l3') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l3') | float(0)) * 1000 %}
          {% set p1_total = p1_l1 + p1_l2 + p1_l3 %}
          {% set charger_power = states('sensor.bender_charging_power_total') | float(0) %}
          {{ (p1_total - charger_power) | round(0) }}

      # House Consumption per phase (excl Charger)
      - name: "Bender House Consumption L1"
        unique_id: "bender_house_consumption_l1"
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% set p1_l1 = (states('sensor.dsmr_reading_phase_currently_delivered_l1') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l1') | float(0)) * 1000 %}
          {% set ch_l1_ma = [[states('sensor.bender_current_l1') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max %}
          {% set ch_l1_w = (ch_l1_ma / 1000) * states('sensor.dsmr_reading_phase_voltage_l1') | float(230) %}
          {{ (p1_l1 - ch_l1_w) | round(0) }}

      - name: "Bender House Consumption L2"
        unique_id: "bender_house_consumption_l2"
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% set p1_l2 = (states('sensor.dsmr_reading_phase_currently_delivered_l2') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l2') | float(0)) * 1000 %}
          {% set ch_l2_ma = [[states('sensor.bender_current_l2') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max %}
          {% set ch_l2_w = (ch_l2_ma / 1000) * states('sensor.dsmr_reading_phase_voltage_l2') | float(230) %}
          {{ (p1_l2 - ch_l2_w) | round(0) }}

      - name: "Bender House Consumption L3"
        unique_id: "bender_house_consumption_l3"
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% set p1_l3 = (states('sensor.dsmr_reading_phase_currently_delivered_l3') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l3') | float(0)) * 1000 %}
          {% set ch_l3_ma = [[states('sensor.bender_current_l3') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max %}
          {% set ch_l3_w = (ch_l3_ma / 1000) * states('sensor.dsmr_reading_phase_voltage_l3') | float(230) %}
          {{ (p1_l3 - ch_l3_w) | round(0) }}

      # Available Current per phase (Bottleneck Calculation)
      # Credit is capped at the last command, and becomes zero BEFORE a stop
      # write. Old 10s Modbus readings must not create fictitious restart room.
      # Calculates available amps for each phase: (Max - Margin - (Grid - Charger))
      # Returns the minimum available amps across all 3 phases (capped at 16A)
      - name: "Bender Loadbalancer Available Current"
        unique_id: "bender_loadbalancer_available_current"
        unit_of_measurement: "A"
        device_class: current
        state: >
          {# Operational sanity bounds for this 230V installation, not a grid-protection relay. #}
          {% set required = ['sensor.dsmr_reading_phase_currently_delivered_l1', 'sensor.dsmr_reading_phase_currently_delivered_l2', 'sensor.dsmr_reading_phase_currently_delivered_l3', 'sensor.dsmr_reading_phase_currently_returned_l1', 'sensor.dsmr_reading_phase_currently_returned_l2', 'sensor.dsmr_reading_phase_currently_returned_l3', 'sensor.dsmr_reading_phase_voltage_l1', 'sensor.dsmr_reading_phase_voltage_l2', 'sensor.dsmr_reading_phase_voltage_l3', 'sensor.p1_meter_power'] %}
          {% set entities = expand(required) %}
          {% set telegram = as_timestamp(states('sensor.dsmr_reading_timestamp'), 0) %}
          {% set telegram_age = as_timestamp(now()) - telegram if telegram > 0 else 999999 %}
          {% set ns = namespace(valid=(entities | count == required | count and telegram > 0 and -5 <= telegram_age <= 30)) %}
          {% for entity in entities %}
            {% if not is_number(entity.state) %}
              {% set ns.valid = false %}
            {% elif 'phase_voltage_' in entity.entity_id and not (180 <= entity.state | float <= 260) %}
              {% set ns.valid = false %}
            {% elif 'phase_currently_' in entity.entity_id and entity.state | float < 0 %}
              {% set ns.valid = false %}
            {% endif %}
          {% endfor %}
          {% if (is_state('input_boolean.bender_loadbalancer_enabled', 'on')
                   or is_state('input_select.bender_failsafe_mode', 'Actief')) and not ns.valid %}
            0.0
          {% elif is_state('input_boolean.bender_loadbalancer_enabled', 'on') %}
            {# --- Configuration --- #}
            {% set max_power = states('input_number.bender_house_max_power') | float(17250) %}
            {% set margin_power = states('input_number.bender_loadbalancer_margin') | float(1000) %}
            
            {# Convert Power Config to Amps per phase (Assuming 3-phase and 230V) #}
            {# 17250W / 3 / 230V = 25A #}
            {% set max_amps = (max_power / 3) / 230 %}
            {% set margin_amps = (margin_power / 3) / 230 %}
            {% set limit_amps = max_amps - margin_amps %}
            
            {# --- Phase 1 --- #}
            {% set v_l1 = states('sensor.dsmr_reading_phase_voltage_l1') | float(230) %}
            {% set grid_l1_w = (states('sensor.dsmr_reading_phase_currently_delivered_l1') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l1') | float(0)) * 1000 %}
            {% set grid_l1_a = grid_l1_w / v_l1 %}
            {% set ch_l1_ma = [[states('sensor.bender_current_l1') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max %}
            {% set ch_l1_a = ch_l1_ma / 1000 %}
            {# Available = Limit - (Grid load without charger) = Limit - (Grid - Charger) #}
            {% set avail_l1 = limit_amps - grid_l1_a + ch_l1_a %}
            
            {# --- Phase 2 --- #}
            {% set v_l2 = states('sensor.dsmr_reading_phase_voltage_l2') | float(230) %}
            {% set grid_l2_w = (states('sensor.dsmr_reading_phase_currently_delivered_l2') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l2') | float(0)) * 1000 %}
            {% set grid_l2_a = grid_l2_w / v_l2 %}
            {% set ch_l2_ma = [[states('sensor.bender_current_l2') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max %}
            {% set ch_l2_a = ch_l2_ma / 1000 %}
            {% set avail_l2 = limit_amps - grid_l2_a + ch_l2_a %}
            
            {# --- Phase 3 --- #}
            {% set v_l3 = states('sensor.dsmr_reading_phase_voltage_l3') | float(230) %}
            {% set grid_l3_w = (states('sensor.dsmr_reading_phase_currently_delivered_l3') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l3') | float(0)) * 1000 %}
            {% set grid_l3_a = grid_l3_w / v_l3 %}
            {% set ch_l3_ma = [[states('sensor.bender_current_l3') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max %}
            {% set ch_l3_a = ch_l3_ma / 1000 %}
            {% set avail_l3 = limit_amps - grid_l3_a + ch_l3_a %}
            
            {# --- Result --- #}
            {# Find the phase with the least headroom (bottleneck) #}
            {% set bottleneck = [avail_l1, avail_l2, avail_l3] | min %}
            
            {# Apply absolute cap of 16A (Charging Strategy Max fallback) and ensure non-negative #}
            {{ [ [bottleneck, 16] | min, 0 ] | max | round(1) }}
          {% else %}
            16.0
          {% endif %}

      # Raw Available Current per phase (calculated values before bottleneck)
      - name: "Bender LB Available Current L1"
        unique_id: "bender_lb_available_current_l1"
        unit_of_measurement: "A"
        device_class: current
        state: >
          {% set voltage = states('sensor.dsmr_reading_phase_voltage_l1') %}
          {% if not is_number(voltage) or not (180 <= voltage | float(0) <= 260) %}
            0.0
          {% elif is_state('input_boolean.bender_loadbalancer_enabled', 'on') %}
            {% set max_power = states('input_number.bender_house_max_power') | float(17250) %}
            {% set margin_power = states('input_number.bender_loadbalancer_margin') | float(1000) %}
            {% set limit_amps = (max_power / 3 / 230) - (margin_power / 3 / 230) %}
            {% set grid_l1_w = (states('sensor.dsmr_reading_phase_currently_delivered_l1') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l1') | float(0)) * 1000 %}
            {% set grid_l1_a = grid_l1_w / states('sensor.dsmr_reading_phase_voltage_l1') | float(230) %}
            {% set ch_l1_a = [[states('sensor.bender_current_l1') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max / 1000 %}
            {{ (limit_amps - grid_l1_a + ch_l1_a) | round(1) }}
          {% else %}
            16.0
          {% endif %}

      - name: "Bender LB Available Current L2"
        unique_id: "bender_lb_available_current_l2"
        unit_of_measurement: "A"
        device_class: current
        state: >
          {% set voltage = states('sensor.dsmr_reading_phase_voltage_l2') %}
          {% if not is_number(voltage) or not (180 <= voltage | float(0) <= 260) %}
            0.0
          {% elif is_state('input_boolean.bender_loadbalancer_enabled', 'on') %}
            {% set max_power = states('input_number.bender_house_max_power') | float(17250) %}
            {% set margin_power = states('input_number.bender_loadbalancer_margin') | float(1000) %}
            {% set limit_amps = (max_power / 3 / 230) - (margin_power / 3 / 230) %}
            {% set grid_l2_w = (states('sensor.dsmr_reading_phase_currently_delivered_l2') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l2') | float(0)) * 1000 %}
            {% set grid_l2_a = grid_l2_w / states('sensor.dsmr_reading_phase_voltage_l2') | float(230) %}
            {% set ch_l2_a = [[states('sensor.bender_current_l2') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max / 1000 %}
            {{ (limit_amps - grid_l2_a + ch_l2_a) | round(1) }}
          {% else %}
            16.0
          {% endif %}

      - name: "Bender LB Available Current L3"
        unique_id: "bender_lb_available_current_l3"
        unit_of_measurement: "A"
        device_class: current
        state: >
          {% set voltage = states('sensor.dsmr_reading_phase_voltage_l3') %}
          {% if not is_number(voltage) or not (180 <= voltage | float(0) <= 260) %}
            0.0
          {% elif is_state('input_boolean.bender_loadbalancer_enabled', 'on') %}
            {% set max_power = states('input_number.bender_house_max_power') | float(17250) %}
            {% set margin_power = states('input_number.bender_loadbalancer_margin') | float(1000) %}
            {% set limit_amps = (max_power / 3 / 230) - (margin_power / 3 / 230) %}
            {% set grid_l3_w = (states('sensor.dsmr_reading_phase_currently_delivered_l3') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l3') | float(0)) * 1000 %}
            {% set grid_l3_a = grid_l3_w / states('sensor.dsmr_reading_phase_voltage_l3') | float(230) %}
            {% set ch_l3_a = [[states('sensor.bender_current_l3') | float(0), states('input_number.bender_commanded_current') | float(0) * 1000] | min, 0] | max / 1000 %}
            {{ (limit_amps - grid_l3_a + ch_l3_a) | round(1) }}
          {% else %}
            16.0
          {% endif %}

      # DSMR Data Freshness - based on the timestamp of the latest P1 telegram.
      # Power values may legitimately stay unchanged at 0 for a long time, so
      # their last_updated value is not a reliable connection watchdog.
      - name: "Bender DSMR Data Leeftijd"
        unique_id: "bender_dsmr_data_leeftijd"
        unit_of_measurement: "s"
        icon: mdi:clock-alert
        state: >
          {% set telegram = as_timestamp(states('sensor.dsmr_reading_timestamp'), 0) %}
          {% if telegram > 0 %}
            {{ [as_timestamp(now()) - telegram, 0] | max | round(0) }}
          {% else %}
            999999
          {% endif %}
        attributes:
          last_update: >
            {{ states('sensor.dsmr_reading_timestamp') }}
          stale: >
            {% set telegram = as_timestamp(states('sensor.dsmr_reading_timestamp'), 0) %}
            {{ telegram <= 0 or not (-5 <= as_timestamp(now()) - telegram <= 30) }}

      # Total Power available for Charger (Visual Only)
      # Based on the bottleneck current * 3 phases * 230V
      - name: "Bender Loadbalancer Available Power"
        unique_id: "bender_loadbalancer_available_power"
        unit_of_measurement: "W"
        device_class: power
        state: >
          {% set available_current = states('sensor.bender_loadbalancer_available_current') | float(0) %}
          {{ (available_current * 3 * 230) | round(0) }}

      # Hours needed to charge the required kWh at max current
      - name: "Bender Dynamic Hours Needed"
        unique_id: "bender_dynamic_hours_needed"
        unit_of_measurement: "h"
        icon: mdi:clock-outline
        state: >
          {% set required_kwh = states('input_number.bender_strategy_required_kwh') | float(0) %}
          {% set max_current = states('input_number.bender_strategy_max_current') | float(16) %}
          {% set voltage = 230 %}
          {% set charging_power_kw = (max_current * 3 * voltage) / 1000 %}
          {% if charging_power_kw > 0 %}
            {{ (required_kwh / charging_power_kw) | round(1) }}
          {% else %}
            0
          {% endif %}

      # Time remaining until departure
      - name: "Bender Dynamic Hours Until Departure"
        unique_id: "bender_dynamic_hours_until_departure"
        unit_of_measurement: "h"
        icon: mdi:clock-end
        state: >
          {% set departure = states('input_datetime.bender_strategy_departure_time') %}
          {% if departure not in ['unknown', 'unavailable', ''] %}
            {% set departure_ts = as_timestamp(departure) %}
            {% set now_ts = as_timestamp(now()) %}
            {% set hours_remaining = (departure_ts - now_ts) / 3600 %}
            {{ [hours_remaining, 0] | max | round(1) }}
          {% else %}
            0
          {% endif %}

      # Latest start time to meet departure deadline
      - name: "Bender Dynamic Latest Start"
        unique_id: "bender_dynamic_latest_start"
        icon: mdi:clock-alert
        state: >
          {% set hours_needed = states('sensor.bender_dynamic_hours_needed') | float(0) %}
          {% set departure = states('input_datetime.bender_strategy_departure_time') %}
          {% if departure not in ['unknown', 'unavailable', ''] and hours_needed > 0 %}
            {% set departure_ts = as_timestamp(departure) %}
            {% set start_ts = departure_ts - (hours_needed * 3600) %}
            {{ start_ts | timestamp_custom('%Y-%m-%d %H:%M', true) }}
          {% elif hours_needed == 0 %}
            Niet nodig
          {% else %}
            unknown
          {% endif %}

      # Active strategy display
      - name: "Bender Strategy Active"
        unique_id: "bender_strategy_active"
        icon: mdi:ev-station
        state: >
          {{ states('input_select.bender_charging_strategy') }}

      # Total current charging power
      - name: "Bender Charging Power Total"
        unique_id: "bender_charging_power_total"
        availability: >
          {{ is_number(states('sensor.bender_power_l1')) and is_number(states('sensor.bender_power_l2')) and is_number(states('sensor.bender_power_l3')) }}
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set l1 = states('sensor.bender_power_l1') | float(0) %}
          {% set l2 = states('sensor.bender_power_l2') | float(0) %}
          {% set l3 = states('sensor.bender_power_l3') | float(0) %}
          {{ (l1 + l2 + l3) | round(0) }}

  # Binary sensor for actual charging status based on real power reading
  - binary_sensor:
      - name: "Bender Charging Active"
        unique_id: "bender_charging_active"
        availability: >
          {{ is_number(states('sensor.bender_totalpower')) }}
        icon: mdi:ev-station
        device_class: power
        state: >
          {{ states('sensor.bender_totalpower') | float(0) > 0 }}

  # Fail-safe health sensors are refreshed every 5 seconds. They are deliberately
  # independent of NodeRed so Home Assistant can stop charging if NodeRed is down.
  - triggers:
      - trigger: time_pattern
        seconds: "/5"
      - trigger: homeassistant
        event: start
    sensor:
      - name: "Bender NodeRed Heartbeat Age"
        unique_id: "bender_nodered_heartbeat_age"
        unit_of_measurement: "s"
        device_class: duration
        state_class: measurement
        icon: mdi:heart-pulse
        state: >
          {% set heartbeat = as_timestamp(states('input_datetime.bender_nodered_heartbeat'), 0) %}
          {% if heartbeat > 0 %}
            {{ [as_timestamp(now()) - heartbeat, 0] | max | round(0) }}
          {% else %}
            999999
          {% endif %}

    binary_sensor:
      - name: "Bender DSMR Data Healthy"
        unique_id: "bender_dsmr_data_healthy"
        icon: mdi:meter-electric-outline
        state: >
          {# Operational sanity bounds for this 230V installation, not a grid-protection relay. #}
          {% set required = ['sensor.dsmr_reading_phase_currently_delivered_l1', 'sensor.dsmr_reading_phase_currently_delivered_l2', 'sensor.dsmr_reading_phase_currently_delivered_l3', 'sensor.dsmr_reading_phase_currently_returned_l1', 'sensor.dsmr_reading_phase_currently_returned_l2', 'sensor.dsmr_reading_phase_currently_returned_l3', 'sensor.dsmr_reading_phase_voltage_l1', 'sensor.dsmr_reading_phase_voltage_l2', 'sensor.dsmr_reading_phase_voltage_l3', 'sensor.p1_meter_power'] %}
          {% set entities = expand(required) %}
          {% set telegram = as_timestamp(states('sensor.dsmr_reading_timestamp'), 0) %}
          {% set telegram_age = as_timestamp(now()) - telegram if telegram > 0 else 999999 %}
          {% set ns = namespace(valid=(entities | count == required | count and telegram > 0 and -5 <= telegram_age <= 30)) %}
          {% for entity in entities %}
            {% if not is_number(entity.state) %}
              {% set ns.valid = false %}
            {% elif 'phase_voltage_' in entity.entity_id and not (180 <= entity.state | float <= 260) %}
              {% set ns.valid = false %}
            {% elif 'phase_currently_' in entity.entity_id and entity.state | float < 0 %}
              {% set ns.valid = false %}
            {% endif %}
          {% endfor %}
          {{ ns.valid }}
        attributes:
          invalid_entities: >
            {% set required = [
              'sensor.dsmr_reading_phase_currently_delivered_l1',
              'sensor.dsmr_reading_phase_currently_delivered_l2',
              'sensor.dsmr_reading_phase_currently_delivered_l3',
              'sensor.dsmr_reading_phase_currently_returned_l1',
              'sensor.dsmr_reading_phase_currently_returned_l2',
              'sensor.dsmr_reading_phase_currently_returned_l3',
              'sensor.dsmr_reading_phase_voltage_l1',
              'sensor.dsmr_reading_phase_voltage_l2',
              'sensor.dsmr_reading_phase_voltage_l3',
              'sensor.p1_meter_power'
            ] %}
            {% set entities = expand(required) %}
            {% set found = entities | map(attribute='entity_id') | list %}
            {% set ns = namespace(invalid=[]) %}
            {% set telegram = as_timestamp(states('sensor.dsmr_reading_timestamp'), 0) %}
            {% set telegram_age = as_timestamp(now()) - telegram if telegram > 0 else 999999 %}
            {% if telegram <= 0 %}
              {% set ns.invalid = ns.invalid + ['sensor.dsmr_reading_timestamp ontbreekt of is ongeldig'] %}
            {% elif telegram_age < -5 %}
              {% set ns.invalid = ns.invalid + ['DSMR-timestamp ' ~ ((-telegram_age) | round(0) | int) ~ 's in de toekomst (maximaal 5s toegestaan)'] %}
            {% elif telegram_age > 30 %}
              {% set ns.invalid = ns.invalid + ['DSMR-telegram ' ~ (telegram_age | round(0) | int) ~ 's oud'] %}
            {% endif %}
            {% for entity_id in required %}
              {% if entity_id not in found %}
                {% set ns.invalid = ns.invalid + [entity_id ~ ' ontbreekt'] %}
              {% endif %}
            {% endfor %}
            {% for entity in entities %}
              {% if entity.state in ['unknown', 'unavailable', 'none', ''] %}
                {% set ns.invalid = ns.invalid + [entity.entity_id ~ '=' ~ entity.state] %}
              {% elif not is_number(entity.state) %}
                {% set ns.invalid = ns.invalid + [entity.entity_id ~ ' is niet numeriek: ' ~ entity.state] %}
              {% elif 'phase_voltage_' in entity.entity_id and not (180 <= entity.state | float <= 260) %}
                {% set ns.invalid = ns.invalid + [entity.entity_id ~ '=' ~ entity.state ~ 'V buiten bruikbaar bereik 180-260V'] %}
              {% elif 'phase_currently_' in entity.entity_id and entity.state | float < 0 %}
                {% set ns.invalid = ns.invalid + [entity.entity_id ~ '=' ~ entity.state ~ 'kW is negatief'] %}
              {% endif %}
            {% endfor %}
            {{ ns.invalid | join(', ') }}

      - name: "Bender NodeRed Heartbeat Healthy"
        unique_id: "bender_nodered_heartbeat_healthy"
        icon: mdi:lan-connect
        state: >
          {{ states('sensor.bender_nodered_heartbeat_age') | float(999999) <= 30 }}

      - name: "Bender Charging Control Healthy"
        unique_id: "bender_charging_control_healthy"
        icon: mdi:shield-check
        state: >
          {{ is_state('binary_sensor.bender_dsmr_data_healthy', 'on')
             and is_state('binary_sensor.bender_nodered_heartbeat_healthy', 'on')
             and is_state('binary_sensor.bender_hems_control_healthy', 'on')
             and is_state('input_boolean.bender_failsafe_active', 'off') }}

  # Poll report timestamps as well as state changes: unchanged zero readings
  # are still fresh. State.last_reported is available in HA 2026.10.
  - triggers:
      - trigger: time_pattern
        seconds: "/5"
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - input_number.bender_commanded_current
          - sensor.bender_current_l1
          - sensor.bender_current_l2
          - sensor.bender_current_l3
          - sensor.bender_hems_limit
          - sensor.bender_totalpower
    binary_sensor:
      - name: "Bender Charger Stopped Fresh"
        unique_id: "bender_charger_stopped_fresh"
        state: >
          {% set cmd = states.input_number.bender_commanded_current %}
          {% set stopped_at = as_timestamp(cmd.last_changed, 0) %}
          {% set timestamp = as_timestamp(now()) %}
          {% set ns = namespace(ok=is_state('input_number.bender_commanded_current', '0.0')
              or is_state('input_number.bender_commanded_current', '0')) %}
          {% set limits = {
            'sensor.bender_current_l1': [200, 25],
            'sensor.bender_current_l2': [200, 25],
            'sensor.bender_current_l3': [200, 25],
            'sensor.bender_totalpower': [50, 25],
            'sensor.bender_hems_limit': [0, 45]
          } %}
          {% set readings = expand(limits.keys() | list) %}
          {% if readings | count != limits | count or stopped_at <= 0 %}
            {% set ns.ok = false %}
          {% endif %}
          {% for reading in readings %}
            {% set reported = as_timestamp(reading.last_reported, 0) %}
            {% set age = timestamp - reported %}
            {% if not is_number(reading.state)
                or reading.state | float(-1) < 0
                or reading.state | float(999999) > limits[reading.entity_id][0]
                or reported < stopped_at or age < 0 or age > limits[reading.entity_id][1] %}
              {% set ns.ok = false %}
            {% endif %}
          {% endfor %}
          {{ ns.ok }}

  # State-based delay_on deliberately resets on any loss of readiness. A
  # separate periodic Direct check starts charging even if LB stays unchanged.
  - binary_sensor:
      - name: "Bender Direct Resume Ready"
        unique_id: "bender_direct_resume_ready"
        delay_on: "00:00:30"
        state: >
          {{ is_state('input_select.bender_charging_strategy', 'Direct')
             and states('input_number.bender_commanded_current') | float(-1) == 0
             and is_state('binary_sensor.bender_charger_stopped_fresh', 'on')
             and is_state('binary_sensor.bender_charging_control_healthy', 'on')
             and is_number(states('sensor.bender_loadbalancer_available_current'))
             and states('sensor.bender_loadbalancer_available_current') | float(0) >= 6
             and states('input_number.bender_strategy_max_current') | float(0) >= 6 }}

###########################################################################################################
# SCRIPTS
###########################################################################################################
script:
  set_bender_safe_current:
    alias: "Set Bender Safe Current"
    description: "Alleen bij losgekoppelde auto, strategie Uit en bevestigde nulstroom."
    sequence:
      - if:
          - condition: template
            value_template: >
              {{ not (is_number(current | default(none))
                 and current | float == current | int
                 and (current | int == 0 or 6 <= current | int <= 16)
                 and is_state('input_select.bender_charging_strategy', 'Uit')
                 and is_state('sensor.bender_vehicle_state', '1')
                 and is_number(states('sensor.bender_hems_limit'))
                 and states('sensor.bender_hems_limit') | float == 0
                 and is_number(states('sensor.bender_totalpower'))
                 and states('sensor.bender_totalpower') | float == 0
                 and is_state('binary_sensor.bender_hems_command_confirmed', 'on')) }}
        then:
          - stop: "Safe Current niet gewijzigd: auto moet los zijn, strategie Uit en HEMS 0A bevestigd; geldige waarde is 0 of geheel 6–16A."
            error: true
      - service: modbus.write_register
        data:
          hub: modbus_hub
          slave: 1
          address: 131
          value: "{{ current | int }}"

  set_bender_hems_limit:
    alias: "Set Bender HEMS Limit"
    icon: mdi:home-lightning-bolt
    # A new stop cancels an older run instead of being silently discarded.
    # Direct positive writes are rechecked here, immediately before Modbus.
    mode: restart
    fields:
      current:
        description: "HEMS Limit in Ampère (0 of 6-16A)"
        example: "16"
    sequence:
      - variables:
          requested_current: "{{ [[current | int(0), 0] | max, 16] | min }}"
          previous_command: "{{ states('input_number.bender_commanded_current') | int(0) }}"
          ack_target: '{{ states(''input_number.bender_requested_current'') | float(-1) }}'
          ack_requested_at: '{{ as_timestamp(states.input_number.bender_requested_current.last_changed, 0) }}'
          ack_reported_at: '{{ as_timestamp(states.sensor.bender_hems_limit.last_reported, 0) }}'
          ack_feedback_age: '{{ as_timestamp(now()) - ack_reported_at | float(0) }}'
          ack_pending_since: '{{ states(''input_number.bender_hems_unconfirmed_since'') | float(0) }}'
          ack_wait_age: '{{ as_timestamp(now()) - (ack_pending_since | float if ack_pending_since | float > 0 else ack_requested_at
            | float) }}'
          ack_confirmed: |-
            {{ is_number(states('input_number.bender_requested_current'))
               and (ack_target | float == 0 or 6 <= ack_target | float <= 16)
               and is_number(states('sensor.bender_hems_limit'))
               and states('sensor.bender_hems_limit') | float == ack_target | float
               and ack_reported_at | float >= ack_requested_at | float
               and 0 <= ack_feedback_age | float <= 45 }}
          ack_healthy: |-
            {% if is_state('input_boolean.bender_failsafe_active', 'on') %}
              {{ ack_confirmed and ack_target | float == 0 }}
            {% else %}
              {{ ack_confirmed or (0 <= ack_wait_age | float <= 45
                  and 0 <= ack_feedback_age | float <= 45
                  and is_number(states('sensor.bender_hems_limit'))
                  and (ack_target | float == 0 or 6 <= ack_target | float <= 16)) }}
            {% endif %}
          dsmr_inputs_valid: >
            {# Operational sanity bounds for this 230V installation, not a grid-protection relay. #}
            {% set required = ['sensor.dsmr_reading_phase_currently_delivered_l1', 'sensor.dsmr_reading_phase_currently_delivered_l2', 'sensor.dsmr_reading_phase_currently_delivered_l3', 'sensor.dsmr_reading_phase_currently_returned_l1', 'sensor.dsmr_reading_phase_currently_returned_l2', 'sensor.dsmr_reading_phase_currently_returned_l3', 'sensor.dsmr_reading_phase_voltage_l1', 'sensor.dsmr_reading_phase_voltage_l2', 'sensor.dsmr_reading_phase_voltage_l3', 'sensor.p1_meter_power'] %}
            {% set entities = expand(required) %}
            {% set telegram = as_timestamp(states('sensor.dsmr_reading_timestamp'), 0) %}
            {% set telegram_age = as_timestamp(now()) - telegram if telegram > 0 else 999999 %}
            {% set ns = namespace(valid=(entities | count == required | count and telegram > 0 and -5 <= telegram_age <= 30)) %}
            {% for entity in entities %}
              {% if not is_number(entity.state) %}
                {% set ns.valid = false %}
              {% elif 'phase_voltage_' in entity.entity_id and not (180 <= entity.state | float <= 260) %}
                {% set ns.valid = false %}
              {% elif 'phase_currently_' in entity.entity_id and entity.state | float < 0 %}
                {% set ns.valid = false %}
              {% endif %}
            {% endfor %}
            {{ ns.valid }}
          applied_current: >
            {% set requested = requested_current | int(0) %}
            {% set direct = is_state('input_select.bender_charging_strategy', 'Direct') %}
            {% set resume = is_state('binary_sensor.bender_direct_resume_ready', 'on')
                and is_state('binary_sensor.bender_charger_stopped_fresh', 'on')
                and as_timestamp(states.binary_sensor.bender_direct_resume_ready.last_changed, 0)
                    >= as_timestamp(states.input_number.bender_commanded_current.last_changed, 0) %}
            {% if requested < 6
                or is_state('input_select.bender_charging_strategy', 'Uit')
                or is_state('input_boolean.bender_failsafe_active', 'on')
                or (is_state('input_select.bender_failsafe_mode', 'Actief') and not ack_healthy)
                or (direct and not is_state('binary_sensor.bender_charging_control_healthy', 'on'))
                or (direct and previous_command | int(0) == 0 and not resume) %}
              0
            {% elif is_state('input_boolean.bender_loadbalancer_enabled', 'on') and (not dsmr_inputs_valid or not is_number(states('sensor.bender_loadbalancer_available_current'))) %}
              0
            {% elif is_state('input_boolean.bender_loadbalancer_enabled', 'on') %}
              {% set allowed = [requested, states('sensor.bender_loadbalancer_available_current') | float(0)] | min | int %}
              {{ allowed if allowed >= 6 else 0 }}
            {% else %}
              {{ requested }}
            {% endif %}

      # Do not rewrite/log an already freshly confirmed command on every refresh.
      - if:
          - condition: template
            value_template: >
              {{ previous_command | int(0) == applied_current | int(0)
                 and is_number(states('sensor.bender_hems_limit'))
                 and states('sensor.bender_hems_limit') | float(-1) == applied_current | int(0)
                 and ack_confirmed and ack_target | float == applied_current | int(0) }}
        then:
          - stop: "HEMS-opdracht is al bevestigd"

      # Keep the oldest unresolved deadline. Retrying or changing the target
      # cannot postpone the watchdog indefinitely. Record intent even if Modbus fails.
      - if:
          - condition: template
            value_template: "{{ ack_pending_since | float <= 0 or ack_confirmed }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.bender_hems_unconfirmed_since
            data:
              value: "{{ as_timestamp(now()) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.bender_requested_current
        data:
          value: "{{ applied_current }}"

      # Suppress old charger-current credit BEFORE sending zero. Repeated zero
      # commands do not reset last_changed, so the fresh-data wait can finish.
      - if:
          - condition: template
            value_template: "{{ applied_current | int(0) == 0 }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.bender_commanded_current
            data:
              value: 0

      - service: modbus.write_register
        data:
          hub: modbus_hub
          slave: 1
          address: 1000
          value: "{{ applied_current }}"

      # Positive credit is enabled only after the Modbus service succeeds.
      - if:
          - condition: template
            value_template: "{{ applied_current | int(0) >= 6 }}"
        then:
          - service: input_number.set_value
            target:
              entity_id: input_number.bender_commanded_current
            data:
              value: "{{ applied_current }}"

      # ---- Logging: leg vast waarom de limiet op dit moment werd ingesteld ----
      - variables:
          _lb:     "{{ states('sensor.bender_loadbalancer_available_current') | float(0) | round(1) }}"
          _lb_l1:  "{{ states('sensor.bender_lb_available_current_l1') | float(0) | round(1) }}"
          _lb_l2:  "{{ states('sensor.bender_lb_available_current_l2') | float(0) | round(1) }}"
          _lb_l3:  "{{ states('sensor.bender_lb_available_current_l3') | float(0) | round(1) }}"
          _g_l1:   "{{ ((states('sensor.dsmr_reading_phase_currently_delivered_l1') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l1') | float(0)) * 1000) | round(0) | int }}"
          _g_l2:   "{{ ((states('sensor.dsmr_reading_phase_currently_delivered_l2') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l2') | float(0)) * 1000) | round(0) | int }}"
          _g_l3:   "{{ ((states('sensor.dsmr_reading_phase_currently_delivered_l3') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l3') | float(0)) * 1000) | round(0) | int }}"
          _ch_l1:  "{{ (states('sensor.bender_current_l1') | float(0) / 1000) | round(1) }}"
          _ch_l2:  "{{ (states('sensor.bender_current_l2') | float(0) / 1000) | round(1) }}"
          _ch_l3:  "{{ (states('sensor.bender_current_l3') | float(0) / 1000) | round(1) }}"
          _dsmr:   "{{ states('sensor.bender_dsmr_data_leeftijd') | int(0) }}"
          _strat:  "{{ states('input_select.bender_charging_strategy') }}"
          _max:    "{{ states('input_number.bender_house_max_power') | float(0) | round(0) | int }}"
          _margin: "{{ states('input_number.bender_loadbalancer_margin') | float(0) | round(0) | int }}"
          _blocked: "{{ requested_current | int(0) != applied_current | int(0) }}"

      - service: logbook.log
        data:
          name: "HEMS Limiet Ingesteld"
          message: >
            → {{ applied_current }}A{% if _blocked %} ({{ requested_current }}A geblokkeerd door beveiliging){% endif %} |
            LB: {{ _lb }}A (L1:{{ _lb_l1 }} L2:{{ _lb_l2 }} L3:{{ _lb_l3 }}) |
            Grid L1:{{ _g_l1 }}W L2:{{ _g_l2 }}W L3:{{ _g_l3 }}W |
            Laadpaal L1:{{ _ch_l1 }}A L2:{{ _ch_l2 }}A L3:{{ _ch_l3 }}A |
            DSMR:{{ _dsmr }}s | Max:{{ _max }}W Marge:{{ _margin }}W | {{ _strat }}
          entity_id: sensor.bender_hems_limit

      - service: input_text.set_value
        target:
          entity_id: input_text.bender_hems_change_context
        data:
          value: >
            {{ now().strftime('%H:%M:%S') }} →{{ applied_current }}A{% if _blocked %} BEVEILIGING({{ requested_current }}A geblokkeerd){% endif %} LB:{{ _lb }}A ({{ _lb_l1 }}/{{ _lb_l2 }}/{{ _lb_l3 }}) Grid:{{ _g_l1 }}/{{ _g_l2 }}/{{ _g_l3 }}W Ch:{{ _ch_l1 }}/{{ _ch_l2 }}/{{ _ch_l3 }}A DSMR:{{ _dsmr }}s

  bender_start_charging:
    alias: "Bender Start Laden (Max)"
    icon: mdi:play-circle
    mode: restart
    sequence:
      - variables:
          max_config: "{{ states('input_number.bender_strategy_max_current') | int(16) }}"
          lb_enabled: "{{ is_state('input_boolean.bender_loadbalancer_enabled', 'on') }}"
          lb_limit: "{{ states('sensor.bender_loadbalancer_available_current') | float(0) if is_number(states('sensor.bender_loadbalancer_available_current')) else 0 }}"
          
          # Calculate final current:
          # If LB enabled: min(max_config, lb_limit, 16)
          # If LB disabled: min(max_config, 16)
          final_current: >
            {% set limit = 16 %}
            {% if lb_enabled %}
              {% set val = [max_config, lb_limit, limit] | min | int %}
            {% else %}
              {% set val = [max_config, limit] | min | int %}
            {% endif %}
            {% set stopped = states('input_number.bender_commanded_current') | int(0) == 0 %}
            {{ 0 if val < 6
                 or not is_state('input_select.bender_charging_strategy', 'Direct')
                 or not is_state('binary_sensor.bender_charging_control_healthy', 'on')
                 or (stopped and not is_state('binary_sensor.bender_direct_resume_ready', 'on'))
               else val }}

      - service: script.set_bender_hems_limit
        data:
          current: "{{ final_current }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.bender_strategy_active_status
        data:
          value: >
            {% if is_state('input_boolean.bender_failsafe_active', 'on') %}
              Fail-safe actief: {{ states('input_text.bender_failsafe_reason') }}
            {% else %}
              {% set commanded = states('input_number.bender_commanded_current') | int(0) %}
              {% if commanded == 0 and lb_limit | float(0) >= 6 %}
                Direct wacht op bevestigde stilstand en 30s stabiele laadruimte
              {% else %}
                Laden op {{ commanded }}A (LB: {{ 'Aan' if lb_enabled else 'Uit' }})
              {% endif %}
            {% endif %}

  bender_stop_charging:
    alias: "Bender Stop Laden"
    icon: mdi:stop-circle
    sequence:
      - service: script.set_bender_hems_limit
        data:
          current: 0
      - service: input_text.set_value
        target:
          entity_id: input_text.bender_strategy_active_status
        data:
          value: >
            {% if is_state('input_boolean.bender_failsafe_active', 'on') %}
              Fail-safe actief: {{ states('input_text.bender_failsafe_reason') }}
            {% else %}
              Laden gestopt
            {% endif %}

  bender_set_charging_current:
    alias: "Bender Stel Laadstroom In"
    icon: mdi:current-ac
    mode: restart
    fields:
      current:
        description: "Laadstroom per fase in Ampère"
        example: 10
    sequence:
      - variables:
          requested_current: "{{ current | int }}"
          lb_enabled: "{{ is_state('input_boolean.bender_loadbalancer_enabled', 'on') }}"
          lb_limit: "{{ states('sensor.bender_loadbalancer_available_current') | float(0) if is_number(states('sensor.bender_loadbalancer_available_current')) else 0 }}"
          
          # Calculate safe current:
          # If LB enabled: min(requested, lb_limit, 16)
          # If LB disabled: min(requested, 16)
          safe_current: >
            {% set limit = 16 %}
            {% if lb_enabled %}
              {{ [requested_current, lb_limit, limit] | min | int }}
            {% else %}
              {{ [requested_current, limit] | min | int }}
            {% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ safe_current >= 6 }}"
            sequence:
              - service: script.set_bender_hems_limit
                data:
                  current: "{{ safe_current }}"
              - service: input_text.set_value
                target:
                  entity_id: input_text.bender_strategy_active_status
                data:
                  value: >
                    {% if is_state('input_boolean.bender_failsafe_active', 'on') %}
                      Fail-safe actief: {{ states('input_text.bender_failsafe_reason') }}
                    {% else %}
                      Laden op {{ states('input_number.bender_commanded_current') | int(0) }}A (LB: {{ 'Aan' if lb_enabled else 'Uit' }})
                    {% endif %}
        default:
          - service: script.bender_stop_charging

  # Stop active session by presenting the same RFID tag that started it
  bender_stop_session:
    alias: "Bender Stop Sessie (RFID)"
    icon: mdi:stop-circle-outline
    sequence:
      - variables:
          owner: "{{ states('sensor.bender_session_owner') }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ owner == 'Ruald' }}"
            sequence:
              - service: script.bender_rfid_ruald
              - service: input_text.set_value
                target:
                  entity_id: input_text.bender_strategy_active_status
                data:
                  value: "Sessie beëindigd (pas Ruald)"
          - conditions:
              - condition: template
                value_template: "{{ owner == 'Ellen' }}"
            sequence:
              - service: script.bender_rfid_ellen
              - service: input_text.set_value
                target:
                  entity_id: input_text.bender_strategy_active_status
                data:
                  value: "Sessie beëindigd (pas Ellen)"
        default:
          - service: logbook.log
            data:
              name: "Bender Sessie Stop"
              message: "Kan sessie niet stoppen: eigenaar onbekend ({{ owner }})"
              entity_id: sensor.bender_session_owner

  # RFID Card Simulation scripts are in bender_chargepoint_integration_private.yaml
  # (excluded from public repo - see .yaml.example for template)

###########################################################################################################
# AUTOMATIONS
###########################################################################################################
automation:

  - alias: Bender Onafhankelijke HEMS Bewaking
    id: bender_independent_hems_guard
    description: Controleert terugmelding en verlaagt onafhankelijk van NodeRed; verhoogt nooit zelfstandig.
    mode: single
    trigger:
    - platform: time_pattern
      seconds: /5
    - platform: state
      entity_id:
      - input_select.bender_charging_strategy
      - input_boolean.bender_failsafe_active
    variables:
      ack_target: '{{ states(''input_number.bender_requested_current'') | float(-1) }}'
      ack_requested_at: '{{ as_timestamp(states.input_number.bender_requested_current.last_changed, 0) }}'
      ack_reported_at: '{{ as_timestamp(states.sensor.bender_hems_limit.last_reported, 0) }}'
      ack_feedback_age: '{{ as_timestamp(now()) - ack_reported_at | float(0) }}'
      ack_pending_since: '{{ states(''input_number.bender_hems_unconfirmed_since'') | float(0) }}'
      ack_wait_age: '{{ as_timestamp(now()) - (ack_pending_since | float if ack_pending_since | float > 0 else ack_requested_at
        | float) }}'
      ack_confirmed: |-
        {{ is_number(states('input_number.bender_requested_current'))
           and (ack_target | float == 0 or 6 <= ack_target | float <= 16)
           and is_number(states('sensor.bender_hems_limit'))
           and states('sensor.bender_hems_limit') | float == ack_target | float
           and ack_reported_at | float >= ack_requested_at | float
           and 0 <= ack_feedback_age | float <= 45 }}
      ack_healthy: |-
        {% if is_state('input_boolean.bender_failsafe_active', 'on') %}
          {{ ack_confirmed and ack_target | float == 0 }}
        {% else %}
          {{ ack_confirmed or (0 <= ack_wait_age | float <= 45
              and 0 <= ack_feedback_age | float <= 45
              and is_number(states('sensor.bender_hems_limit'))
              and (ack_target | float == 0 or 6 <= ack_target | float <= 16)) }}
        {% endif %}
      safe_ceiling: |-
        {% set lb = states('sensor.bender_loadbalancer_available_current') %}
        {% if is_state('input_select.bender_charging_strategy', 'Uit')
              or is_state('input_boolean.bender_failsafe_active', 'on')
              or not is_state('binary_sensor.bender_dsmr_data_healthy', 'on')
              or not is_state('binary_sensor.bender_nodered_heartbeat_healthy', 'on')
              or not ack_healthy %}
          0
        {% elif is_state('input_boolean.bender_loadbalancer_enabled', 'on') %}
          {% set cap = [lb | float(0), 16] | min | int if is_number(lb) else 0 %}
          {{ cap if cap >= 6 else 0 }}
        {% else %}16{% endif %}
      lower_target: '{{ [[ack_target | int(0), safe_ceiling | int(0)] | min, 0] | max }}'
      must_lower: |-
        {{ ack_target | float > safe_ceiling | float
           or states('input_number.bender_commanded_current') | float(0) > safe_ceiling | float
           or (is_number(states('sensor.bender_hems_limit'))
               and states('sensor.bender_hems_limit') | float > safe_ceiling | float) }}
      retry_stop: '{{ ack_target | float == 0 and not ack_confirmed and ack_wait_age | float >= 10 }}'
    action:
    - if:
      - condition: template
        value_template: '{{ ack_confirmed and ack_pending_since | float > 0 and is_state(''script.set_bender_hems_limit'', ''off'')
          and as_timestamp(states.input_number.bender_requested_current.last_changed, 0) == ack_requested_at | float }}'
      then:
      - service: input_number.set_value
        target:
          entity_id: input_number.bender_hems_unconfirmed_since
        data:
          value: 0
    - if:
      - condition: state
        entity_id: input_select.bender_failsafe_mode
        state: Actief
      - condition: state
        entity_id: script.set_bender_hems_limit
        state: 'off'
      - condition: template
        value_template: '{{ must_lower or retry_stop }}'
      then:
      - action: script.turn_on
        target:
          entity_id: script.set_bender_hems_limit
        data:
          variables:
            current: '{{ lower_target }}'


  # Hard fail-safe watchdog. In Monitoren it only records what it sees. Only
  # mode Actief may set the HEMS limit to 0A and block NodeRed strategies.
  - alias: "Bender Hard Fail-safe Watchdog"
    id: "bender_hard_failsafe_watchdog"
    description: "Bewaakt DSMR, NodeRed en HEMS-terugmelding; grijpt alleen in modus Actief in"
    mode: single
    trigger:
      - platform: time_pattern
        seconds: "/5"
      - platform: homeassistant
        event: start
      - platform: state
        entity_id:
          - binary_sensor.bender_hems_control_healthy
          - binary_sensor.bender_dsmr_data_healthy
          - binary_sensor.bender_nodered_heartbeat_healthy
    variables:
      dsmr_healthy: "{{ is_state('binary_sensor.bender_dsmr_data_healthy', 'on') }}"
      nodered_healthy: "{{ is_state('binary_sensor.bender_nodered_heartbeat_healthy', 'on') }}"
      hems_healthy: "{{ is_state('binary_sensor.bender_hems_control_healthy', 'on') }}"
      failsafe_mode: "{{ states('input_select.bender_failsafe_mode') }}"
      failsafe_was_active: "{{ is_state('input_boolean.bender_failsafe_active', 'on') }}"
      fault_was_observed: "{{ is_state('input_boolean.bender_failsafe_observed', 'on') }}"
      notifications_enabled: "{{ is_state('input_boolean.bender_failsafe_notifications_enabled', 'on') }}"
      failure_reason: >
        {% if not dsmr_healthy %}
          {% set invalid = state_attr('binary_sensor.bender_dsmr_data_healthy', 'invalid_entities') | default('', true) %}
          DSMR-data ontbreekt of is ouder dan 30s{% if invalid %}: {{ invalid[:170] }}{% endif %}
        {% elif not nodered_healthy %}
          NodeRed-heartbeat is {{ states('sensor.bender_nodered_heartbeat_age') | int(999999) }}s oud
        {% elif not hems_healthy %}
          HEMS-terugmelding ontbreekt of bevestigt opdracht niet: gevraagd {{ states('input_number.bender_requested_current') }}A, gemeten {{ states('sensor.bender_hems_limit') }}A
        {% else %}
          Onbekende besturingsfout
        {% endif %}
    action:
      # Leaving mode Actief immediately removes the enforcement latch. This
      # never writes a new current; NodeRed may then re-evaluate its strategy.
      - if:
          - condition: template
            value_template: "{{ failsafe_mode != 'Actief' and failsafe_was_active }}"
        then:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.bender_failsafe_active
          - service: logbook.log
            data:
              name: "Laadpaal Hard Fail-safe"
              message: "Ingrijpen uitgeschakeld; modus is {{ failsafe_mode }}"
              entity_id: input_boolean.bender_failsafe_active

      - if:
          - condition: template
            value_template: >
              {{ failsafe_mode != 'Actief'
                 and is_state('input_boolean.bender_failsafe_manual_restore_pending', 'on') }}
        then:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.bender_failsafe_manual_restore_pending

      - choose:
          # Mode Uit clears monitoring state and performs no watchdog action.
          - conditions:
              - condition: template
                value_template: "{{ failsafe_mode == 'Uit' }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: timer.bender_failsafe_recovery
                    state: "active"
                then:
                  - service: timer.cancel
                    target:
                      entity_id: timer.bender_failsafe_recovery
              - if:
                  - condition: state
                    entity_id: input_boolean.bender_failsafe_observed
                    state: "on"
                then:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.bender_failsafe_observed
              - if:
                  - condition: state
                    entity_id: input_boolean.bender_failsafe_manual_restore_pending
                    state: "on"
                then:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.bender_failsafe_manual_restore_pending

          - conditions:
              - condition: template
                value_template: "{{ not dsmr_healthy or not nodered_healthy or not hems_healthy }}"
            sequence:
              - if:
                  - condition: state
                    entity_id: timer.bender_failsafe_recovery
                    state: "active"
                then:
                  - service: timer.cancel
                    target:
                      entity_id: timer.bender_failsafe_recovery

              # Latch the detected fault once in both Monitoren and Actief.
              - if:
                  - condition: template
                    value_template: "{{ not fault_was_observed }}"
                then:
                  - service: input_text.set_value
                    target:
                      entity_id: input_text.bender_failsafe_reason
                    data:
                      value: "{{ failure_reason }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.bender_failsafe_observed
                  - service: logbook.log
                    data:
                      name: "Laadpaal Fail-safe Monitor"
                      message: >
                        Storing gedetecteerd in modus {{ failsafe_mode }}: {{ failure_reason }}
                      entity_id: input_boolean.bender_failsafe_observed

              # Enforcement is deliberately impossible in Uit or Monitoren.
              - if:
                  - condition: template
                    value_template: "{{ failsafe_mode == 'Actief' and not failsafe_was_active }}"
                then:
                  - variables:
                      previous_hems: "{{ states('sensor.bender_hems_limit') | int(0) }}"
                      strategy: "{{ states('input_select.bender_charging_strategy') }}"
                  - service: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.bender_failsafe_manual_restore_pending
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.bender_failsafe_previous_hems
                    data:
                      value: "{{ previous_hems }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.bender_failsafe_active
                  # Start the Modbus write without waiting for it. A broken
                  # Modbus connection must never block the watchdog or push.
                  - action: script.turn_on
                    target:
                      entity_id: script.set_bender_hems_limit
                    data:
                      variables:
                        current: 0
                  - service: input_text.set_value
                    target:
                      entity_id: input_text.bender_strategy_active_status
                    data:
                      value: "Fail-safe actief: {{ failure_reason }}"
                  - if:
                      - condition: template
                        value_template: "{{ notifications_enabled }}"
                    then:
                      - action: notify.send_message
                        continue_on_error: true
                        target:
                          entity_id: notify.iphone_17_ruald
                        data:
                          message: >
                            ⚠️ Laadpaal fail-safe actief. Pauzeeropdracht 0A is verstuurd.
                            Reden: {{ failure_reason }}. Strategie: {{ strategy }}.
                            Vorige HEMS-limit: {{ previous_hems }}A.
                  - service: logbook.log
                    data:
                      name: "Laadpaal Hard Fail-safe"
                      message: >
                        Geactiveerd: {{ failure_reason }} | Strategie: {{ strategy }} |
                        Vorige HEMS: {{ previous_hems }}A → 0A
                      entity_id: input_boolean.bender_failsafe_active

              # Re-assert 0A if a write outside the guarded HA scripts changed HEMS.
              - if:
                  - condition: template
                    value_template: >
                      {{ failsafe_mode == 'Actief'
                         and failsafe_was_active
                         and not is_state('binary_sensor.bender_hems_command_confirmed', 'on')
                         and is_state('script.set_bender_hems_limit', 'off') }}
                then:
                  - action: script.turn_on
                    target:
                      entity_id: script.set_bender_hems_limit
                    data:
                      variables:
                        current: 0

        default:
          - if:
              - condition: state
                entity_id: input_boolean.bender_failsafe_observed
                state: "on"
              - condition: state
                entity_id: timer.bender_failsafe_recovery
                state: "idle"
            then:
              - service: timer.start
                target:
                  entity_id: timer.bender_failsafe_recovery
                data:
                  duration: "00:00:30"

  - alias: "Bender Hard Fail-safe Hersteld"
    id: "bender_hard_failsafe_recovered"
    description: "Hervat pas na 30s gezonde DSMR, NodeRed en HEMS-terugmelding; bij ingrijpen is eerst 0A bevestigd"
    mode: single
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.bender_failsafe_recovery
    condition:
      - condition: state
        entity_id: input_boolean.bender_failsafe_observed
        state: "on"
      - condition: state
        entity_id: binary_sensor.bender_dsmr_data_healthy
        state: "on"
      - condition: state
        entity_id: binary_sensor.bender_nodered_heartbeat_healthy
        state: "on"
      - condition: state
        entity_id: binary_sensor.bender_hems_control_healthy
        state: "on"
    action:
      - variables:
          strategy: "{{ states('input_select.bender_charging_strategy') }}"
          lb_limit: "{{ states('sensor.bender_loadbalancer_available_current') | float(0) | round(1) }}"
          was_enforced: "{{ is_state('input_boolean.bender_failsafe_active', 'on') }}"
          notifications_enabled: "{{ is_state('input_boolean.bender_failsafe_notifications_enabled', 'on') }}"
          previous_hems: "{{ states('input_number.bender_failsafe_previous_hems') | int(0) }}"
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.bender_failsafe_active
            - input_boolean.bender_failsafe_observed
      - service: input_text.set_value
        target:
          entity_id: input_text.bender_failsafe_reason
        data:
          value: "Geen storing - DSMR, NodeRed en HEMS zijn 30s stabiel"
      - if:
          - condition: template
            value_template: "{{ was_enforced }}"
        then:
          - service: input_text.set_value
            target:
              entity_id: input_text.bender_strategy_active_status
            data:
              value: "Fail-safe hersteld; strategie {{ strategy }} wordt opnieuw beoordeeld"
          - if:
              - condition: template
                value_template: "{{ notifications_enabled }}"
            then:
              - action: notify.send_message
                continue_on_error: true
                target:
                  entity_id: notify.iphone_17_ruald
                data:
                  message: >
                    ✅ Laadpaal fail-safe opgeheven. DSMR, NodeRed en HEMS zijn 30 seconden stabiel.
                    Strategie {{ strategy }} wordt opnieuw beoordeeld met {{ lb_limit }}A beschikbaar.
          # Manual has no independent setpoint: it normally reads the current
          # HEMS value, which is 0A after a fail-safe. Arm a separate retry that
          # waits until at least the EV minimum of 6A is safely available. The
          # regular LB-aware charging script still performs the final clamp.
          # Other strategies are recalculated by the NodeRed recovery trigger.
          - if:
              - condition: template
                value_template: "{{ strategy == 'Manual' and previous_hems >= 6 }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.bender_failsafe_manual_restore_pending
      - service: logbook.log
        data:
          name: "Laadpaal Hard Fail-safe"
          message: >
            Hersteld na 30s stabiele data | Ingrijpen: {{ was_enforced }} | Strategie: {{ strategy }} |
            Vorige HEMS: {{ previous_hems }}A | LB beschikbaar: {{ lb_limit }}A
          entity_id: input_boolean.bender_failsafe_observed

  # Manual stores its desired value in the live HEMS register. A fail-safe sets
  # that register to 0A, so a one-shot recovery can fail when less than 6A is
  # available at that exact moment. Keep retrying without writing until at least
  # 6A is safe. Any confirmed positive HEMS value completes the retry, including
  # a manual user override, so this automation never fights a later choice.
  - alias: "Bender Manual Fail-safe Herstel Opnieuw Proberen"
    id: "bender_manual_failsafe_restore_retry"
    description: "Hervat Manual veilig zodra na een fail-safe minimaal 6A beschikbaar is"
    mode: single
    trigger:
      - platform: time_pattern
        seconds: "/10"
      - platform: state
        entity_id:
          - sensor.bender_hems_limit
          - input_select.bender_charging_strategy
          - input_select.bender_failsafe_mode
    condition:
      - condition: state
        entity_id: input_boolean.bender_failsafe_manual_restore_pending
        state: "on"
    variables:
      strategy: "{{ states('input_select.bender_charging_strategy') }}"
      failsafe_mode: "{{ states('input_select.bender_failsafe_mode') }}"
      previous_hems: "{{ states('input_number.bender_failsafe_previous_hems') | int(0) }}"
      current_hems_valid: >
        {{ states('sensor.bender_hems_limit') not in ['unknown', 'unavailable'] }}
      current_hems: "{{ states('sensor.bender_hems_limit') | int(0) }}"
      lb_enabled: "{{ is_state('input_boolean.bender_loadbalancer_enabled', 'on') }}"
      lb_limit: "{{ states('sensor.bender_loadbalancer_available_current') | float(0) if is_number(states('sensor.bender_loadbalancer_available_current')) else 0 }}"
      safe_current: >
        {% if lb_enabled %}
          {{ [previous_hems, lb_limit, 16] | min | int }}
        {% else %}
          {{ [previous_hems, 16] | min | int }}
        {% endif %}
    action:
      - choose:
          # Changing strategy/mode is an explicit user choice: cancel the old
          # Manual recovery instead of applying a delayed current unexpectedly.
          - conditions:
              - condition: template
                value_template: >
                  {{ strategy != 'Manual' or failsafe_mode != 'Actief' or previous_hems < 6 }}
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.bender_failsafe_manual_restore_pending
              - service: logbook.log
                data:
                  name: "Laadpaal Manual Herstel"
                  message: >
                    Automatisch herstel geannuleerd | Strategie: {{ strategy }} |
                    Fail-safe modus: {{ failsafe_mode }} | Vorige HEMS: {{ previous_hems }}A
                  entity_id: input_boolean.bender_failsafe_manual_restore_pending

          # A confirmed positive read-back means either the automatic retry or
          # a manual override succeeded. Stop immediately to avoid later raises.
          - conditions:
              - condition: template
                value_template: "{{ current_hems_valid and current_hems >= 6 and is_state('binary_sensor.bender_hems_command_confirmed', 'on') }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.bender_failsafe_manual_restore_pending
              - service: logbook.log
                data:
                  name: "Laadpaal Manual Herstel"
                  message: >
                    Herstel bevestigd op {{ current_hems }}A; opgeslagen waarde was {{ previous_hems }}A
                  entity_id: sensor.bender_hems_limit

          # Do nothing while either watchdog input is unhealthy. At 6A or more,
          # request the saved value; bender_set_charging_current clamps it to the
          # currently available load-balancer capacity.
          - conditions:
              - condition: state
                entity_id: binary_sensor.bender_dsmr_data_healthy
                state: "on"
              - condition: state
                entity_id: binary_sensor.bender_nodered_heartbeat_healthy
                state: "on"
              - condition: state
                entity_id: input_boolean.bender_failsafe_active
                state: "off"
              - condition: template
                value_template: >
                  {{ current_hems_valid and current_hems < 6 and safe_current >= 6
                     and is_state('binary_sensor.bender_hems_control_healthy', 'on') }}
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.bender_set_charging_current
                data:
                  variables:
                    current: "{{ previous_hems }}"
              - service: logbook.log
                data:
                  name: "Laadpaal Manual Herstel"
                  message: >
                    Herpoging gestart | Opgeslagen: {{ previous_hems }}A |
                    Veilig beschikbaar: {{ safe_current }}A | LB: {{ lb_limit | round(1) }}A
                  entity_id: input_boolean.bender_failsafe_manual_restore_pending

  # Beëindigt de laadsessie op het ingestelde tijdstip door de juiste RFID-pas aan te bieden
  - alias: "Bender Manual Sessie Stop op Tijdstip"
    id: "bender_manual_session_stop_timer"
    description: "Stopt de laadsessie op het geplande tijdstip door RFID-pas van de sessie-eigenaar te schrijven"
    trigger:
      - platform: time
        at: input_datetime.bender_manual_stop_time
    condition:
      - condition: state
        entity_id: input_boolean.bender_manual_stop_scheduled
        state: "on"
      - condition: state
        entity_id: input_select.bender_charging_strategy
        state: "Manual"
    action:
      - service: script.bender_stop_session
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.bender_manual_stop_scheduled
      - service: logbook.log
        data:
          name: "Bender Sessie Stop"
          message: "Sessie beëindigd op gepland tijdstip ({{ states('input_datetime.bender_manual_stop_time') }})"
          entity_id: sensor.bender_session_owner

  # Logt elke bevestigde Modbus read-back wijziging van de HEMS limiet.
  # Dit vangt OOK wijzigingen die NIET via onze scripts gaan (bijv. Node-RED directe Modbus write).
  # Scan interval sensor.bender_hems_limit = 30s, dus er is max. 30s vertraging t.o.v. de werkelijke write.
  - alias: "Bender HEMS Limiet Monitor - Log Modbus Wijziging"
    id: "bender_hems_limit_monitor_modbus"
    description: "Logt elke bevestigde Modbus-wijziging van HEMS limiet (register 1000) met volledige LB-context"
    trigger:
      - platform: state
        entity_id: sensor.bender_hems_limit
    condition:
      - condition: template
        value_template: >
          {{ trigger.from_state is not none
             and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.from_state.state != trigger.to_state.state }}
    action:
      - variables:
          _old:    "{{ trigger.from_state.state }}"
          _new:    "{{ trigger.to_state.state }}"
          _lb:     "{{ states('sensor.bender_loadbalancer_available_current') | float(0) | round(1) }}"
          _lb_l1:  "{{ states('sensor.bender_lb_available_current_l1') | float(0) | round(1) }}"
          _lb_l2:  "{{ states('sensor.bender_lb_available_current_l2') | float(0) | round(1) }}"
          _lb_l3:  "{{ states('sensor.bender_lb_available_current_l3') | float(0) | round(1) }}"
          _g_l1:   "{{ ((states('sensor.dsmr_reading_phase_currently_delivered_l1') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l1') | float(0)) * 1000) | round(0) | int }}"
          _g_l2:   "{{ ((states('sensor.dsmr_reading_phase_currently_delivered_l2') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l2') | float(0)) * 1000) | round(0) | int }}"
          _g_l3:   "{{ ((states('sensor.dsmr_reading_phase_currently_delivered_l3') | float(0) - states('sensor.dsmr_reading_phase_currently_returned_l3') | float(0)) * 1000) | round(0) | int }}"
          _ch_l1:  "{{ (states('sensor.bender_current_l1') | float(0) / 1000) | round(1) }}"
          _ch_l2:  "{{ (states('sensor.bender_current_l2') | float(0) / 1000) | round(1) }}"
          _ch_l3:  "{{ (states('sensor.bender_current_l3') | float(0) / 1000) | round(1) }}"
          _dsmr:   "{{ states('sensor.bender_dsmr_data_leeftijd') | int(0) }}"
          _strat:  "{{ states('input_select.bender_charging_strategy') }}"
      - service: logbook.log
        data:
          name: "HEMS Limiet Gewijzigd (Modbus)"
          message: >
            {{ _old }}A → {{ _new }}A | LB beschikbaar: {{ _lb }}A (L1:{{ _lb_l1 }} L2:{{ _lb_l2 }} L3:{{ _lb_l3 }}) |
            Grid L1:{{ _g_l1 }}W L2:{{ _g_l2 }}W L3:{{ _g_l3 }}W |
            Laadpaal L1:{{ _ch_l1 }}A L2:{{ _ch_l2 }}A L3:{{ _ch_l3 }}A |
            DSMR:{{ _dsmr }}s | {{ _strat }}
          entity_id: sensor.bender_hems_limit
